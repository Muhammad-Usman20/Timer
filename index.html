<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Countdown Timer</title>
    <link rel="shortcut icon" href="icon.avif"  type="x-icon">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Countdown Timer</h1>

    <div class="inputs">
      <input type="number" id="hoursInput" placeholder="Hours" min="0">
      <input type="number" id="minutesInput" placeholder="Minutes" min="0" max="59">
      <input type="number" id="secondsInput" placeholder="Seconds" min="0" max="59">
    </div>

    <div id="display">00:00:00</div>

    <div class="buttons">
      <button onclick="startCountdown()">Start</button>
      <button onclick="pauseCountdown()">Pause</button>
      <button onclick="resetCountdown()">Reset</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
